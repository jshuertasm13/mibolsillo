<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi Bolsillo</title>
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mi Bolsillo">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Plan: tablero claro, una sola temática (preferencia: tema claro). Barra superior con mes + acción principal,
   pestañas, y contenido en rejilla: resumen arriba, detalle abajo. */
:root{
  --bg:#EEF1F5;
  --surface:#FFFFFF;
  --ink:#15202B;
  --muted:#5D6A78;
  --line:#DCE2EA;
  --accent:#2448C9;
  --accent-soft:#E7ECFC;
  --pos:#0C7F57;
  --pos-soft:#E1F3EA;
  --neg:#C23C2C;
  --neg-soft:#FBE8E5;
  --warn:#A86A12;
  --warn-soft:#FBF0DB;
  --f-display:'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --f-body:'Figtree', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --r:12px;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Top bar */
.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.top-in{max-width:1120px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand h1{font-size:22px}
.status{font-size:12px;color:var(--muted)}
.status.err{color:var(--neg)}
.month{display:flex;align-items:center;gap:4px;background:var(--bg);border-radius:999px;padding:3px}
.month button{border:0;background:transparent;width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:18px;color:var(--muted)}
.month button:hover{background:var(--surface);color:var(--ink)}
.month span{min-width:132px;text-align:center;font-weight:600;text-transform:capitalize}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:#B9C3D0}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#1C3CAD}
.btn.danger{color:var(--neg)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn.ghost{border-color:transparent;background:transparent}
.tabs{max-width:1120px;margin:0 auto;padding:0 20px;display:flex;gap:4px;overflow-x:auto}
.tabs button{border:0;background:transparent;padding:10px 12px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}

main{max-width:1120px;margin:0 auto;padding:20px;display:grid;gap:16px}
.banner{background:var(--warn-soft);border:1px solid #EBD3A6;border-radius:var(--r);padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.banner p{margin:0;flex:1;min-width:240px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card h2{font-size:17px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card h2 .sub{font-family:var(--f-body);font-weight:500;font-size:13px;color:var(--muted);margin-left:auto}
.grid2{display:grid;grid-template-columns:1.25fr 1fr;gap:16px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:2px}
.tile .lbl{font-size:13px;color:var(--muted);font-weight:500}
.tile .val{font-family:var(--f-display);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.tile .hint{font-size:12px;color:var(--muted)}
.tile.pos .val{color:var(--pos)} .tile.neg .val{color:var(--neg)}
.muted{color:var(--muted)}
.empty{color:var(--muted);padding:18px;text-align:center;border:1px dashed var(--line);border-radius:10px}

/* Category bars */
.cats{display:grid;gap:10px}
.catrow{display:grid;grid-template-columns:minmax(110px,170px) 1fr auto;gap:10px;align-items:center;font-size:14px}
.catrow .name{display:flex;align-items:center;gap:8px;overflow:hidden}
.catrow .name span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:3px;flex:none}
.bar{position:relative;height:12px;background:var(--bg);border-radius:6px}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:6px}
.bar b{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);opacity:.55;border-radius:1px}
.catrow .amt{text-align:right;font-variant-numeric:tabular-nums;min-width:120px}
.catrow .amt small{display:block;color:var(--muted);font-size:12px}
.catrow.over .amt{color:var(--neg)}

/* Alerts */
.alerts{display:grid;gap:8px}
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;font-size:14px;background:var(--bg)}
.alert .pill{flex:none}
.pill{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;text-transform:uppercase;letter-spacing:.03em}
.pill.neg{background:var(--neg-soft);color:var(--neg)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.pos{background:var(--pos-soft);color:var(--pos)}
.pill.info{background:var(--accent-soft);color:var(--accent)}
.pill.gray{background:var(--bg);color:var(--muted)}

/* Movements */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar input,.toolbar select{border:1px solid var(--line);border-radius:9px;padding:7px 10px;background:var(--surface)}
.toolbar input[type=search]{flex:1;min-width:180px}
.day{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:12px 0 4px}
.mov{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:9px 8px;border-radius:9px;cursor:pointer;border:0;background:transparent;width:100%;text-align:left}
.mov:hover{background:var(--bg)}
.mov .ico{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff}
.mov .t{font-weight:600}
.mov .s{font-size:13px;color:var(--muted)}
.mov .m{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.mov .m.in{color:var(--pos)}
.mov .m small{display:block;font-weight:500;font-size:12px;color:var(--muted)}

/* Subscriptions */
.sub-head{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.subs{display:grid;gap:8px}
.subrow{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr 1.1fr auto;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:10px;border-left-width:4px}
.subrow.s-activa{border-left-color:var(--pos)}
.subrow.s-evaluar{border-left-color:var(--warn)}
.subrow.s-cancelar{border-left-color:var(--neg)}
.subrow.s-cancelada{border-left-color:var(--line);opacity:.62}
.subrow .nm{font-weight:700}
.subrow .k{font-size:12px;color:var(--muted)}
.subrow .v{font-variant-numeric:tabular-nums;font-weight:600}
.subrow select{border:1px solid var(--line);border-radius:8px;padding:5px 6px;background:var(--surface);width:100%}
.subrow .acts{display:flex;gap:6px;justify-content:flex-end}
.saving{background:var(--pos-soft);border-radius:var(--r);padding:16px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.saving .big{font-family:var(--f-display);font-size:28px;font-weight:700;color:var(--pos);font-variant-numeric:tabular-nums}
.ctl{display:grid;gap:8px}
.ctlrow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 12px;border-radius:10px;background:var(--bg)}
.ctlrow .msg{font-size:14px}
.ctlrow .msg strong{font-weight:700}
.ctlrow .bt{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.badge{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--neg);color:#fff;font-size:11px;font-weight:700;margin-left:6px;vertical-align:1px}
@media (max-width:600px){.ctlrow{grid-template-columns:1fr}.ctlrow .bt{justify-content:flex-start}}

/* Debts */
.debts{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.debt{border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:10px;background:var(--surface)}
.debt .hd{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.debt .nm{font-weight:700;font-size:16px}
.debt .kv{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;font-size:14px}
.debt .kv div span{display:block;font-size:12px;color:var(--muted)}
.prog{height:8px;background:var(--bg);border-radius:4px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--pos)}

/* Categories */
.catlist{display:grid;gap:6px}
.catedit{display:grid;grid-template-columns:auto 1fr 170px auto;gap:10px;align-items:center;padding:8px;border-radius:9px;background:var(--bg)}
.catedit input{border:1px solid var(--line);border-radius:8px;padding:6px 9px;background:var(--surface);width:100%}
.swatch{width:26px;height:26px;border-radius:7px;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);cursor:pointer}

/* Chart */
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted);margin-top:6px}
.legend span{display:inline-flex;align-items:center;gap:6px}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(21,32,43,.38);display:grid;place-items:center;padding:16px;z-index:50}
.modal{background:var(--surface);border-radius:16px;width:min(520px,100%);max-height:calc(100% - 20px);overflow:auto;padding:22px;box-shadow:0 20px 50px rgba(21,32,43,.25)}
.modal h3{font-size:20px;margin-bottom:14px}
.form{display:grid;gap:12px}
.field{display:grid;gap:5px}
.field label,.field .lab{font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:var(--surface);width:100%}
.field input.big{font-family:var(--f-display);font-size:26px;font-weight:700;padding:8px 12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:flex;background:var(--bg);border-radius:10px;padding:3px}
.seg button{flex:1;border:0;background:transparent;padding:8px;border-radius:8px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.seg button[aria-pressed="true"].g{color:var(--neg)} .seg button[aria-pressed="true"].i{color:var(--pos)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;cursor:pointer;font-size:13px;display:inline-flex;gap:6px;align-items:center}
.chips button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:6px}
.actions .left{margin-right:auto}
.note{font-size:13px;color:var(--muted);margin:0}
.smart{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.smart .btn{justify-content:center;padding:11px 12px;cursor:pointer}
.smart .btn.rec{background:var(--neg-soft);border-color:var(--neg);color:var(--neg)}
.smartbox{display:grid;gap:8px;background:var(--bg);border-radius:12px;padding:12px}
.smartbox textarea{border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:var(--surface);width:100%;min-height:58px;resize:vertical}
.smartbox img{max-height:140px;max-width:100%;border-radius:8px;justify-self:start;border:1px solid var(--line)}
.smartbox .st{font-size:13px;color:var(--muted);margin:0}
.smartbox .st.ok{color:var(--pos)} .smartbox .st.err{color:var(--neg)}
.pbar{height:6px;background:var(--surface);border-radius:3px;overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.filled{animation:flash 1.2s ease}
@keyframes flash{0%{background:var(--accent-soft)}100%{background:var(--surface)}}
.palette{display:flex;flex-wrap:wrap;gap:6px}
.palette button{width:26px;height:26px;border-radius:7px;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);cursor:pointer}
.palette button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}

@media (max-width:860px){
  .tiles{grid-template-columns:repeat(2,1fr)}
  .grid2{grid-template-columns:1fr}
  .sub-head{grid-template-columns:1fr}
  .subrow{grid-template-columns:1fr 1fr;}
  .subrow .nmc{grid-column:1/-1}
  .subrow .acts{grid-column:1/-1;justify-content:flex-start}
}
@media (max-width:480px){
  .top-in,.tabs,main{padding-left:16px;padding-right:16px}
  .tile .val{font-size:20px}
  .catrow{grid-template-columns:1fr auto}
  .catrow .bar{grid-column:1/-1;order:3}
  .catedit{grid-template-columns:auto 1fr;}
  .catedit .bud,.catedit .del{grid-column:2}
  .row2{grid-template-columns:1fr}
  .month span{min-width:104px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand"><h1>Mi Bolsillo</h1><span class="status" id="status">Cargando…</span></div>
    <div class="month" aria-label="Mes">
      <button id="prevM" aria-label="Mes anterior">‹</button>
      <span id="monthLbl" class="num"></span>
      <button id="nextM" aria-label="Mes siguiente">›</button>
    </div>
    <button class="btn primary" data-act="newMov" title="Atajo: tecla N">+ Movimiento</button>
  </div>
  <nav class="tabs" role="tablist" id="tabs">
    <button role="tab" data-tab="resumen">Resumen</button>
    <button role="tab" data-tab="movimientos">Movimientos</button>
    <button role="tab" data-tab="suscripciones">Suscripciones<span id="subBadge"></span></button>
    <button role="tab" data-tab="deudas">Deudas</button>
    <button role="tab" data-tab="categorias">Categorías y presupuesto</button>
    <button role="tab" data-tab="ajustes">Ajustes y respaldo</button>
  </nav>
</header>
<main id="main"></main>
<div id="modalRoot"></div>

<script>
(() => {
'use strict';
// ---------- Utilidades ----------
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const MES3 = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const PALETTE = ['#2448C9','#0C7F57','#C23C2C','#A86A12','#7444B8','#0E7C8C','#C9487A','#5E6B23','#8A5A44','#4A5568','#D9731C','#2F8F8A'];
const COP = new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0});
const NUM = new Intl.NumberFormat('es-CO',{maximumFractionDigits:0});
const fmt = n => COP.format(Math.round(n||0));
const fmtShort = n => { const a=Math.abs(n); if(a>=1e6) return (n/1e6).toFixed(a>=1e7?0:1).replace('.',',')+' M'; if(a>=1e3) return Math.round(n/1e3)+' mil'; return String(Math.round(n)); };
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const pad = n => String(n).padStart(2,'0');
const todayISO = () => { const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const monthOf = iso => iso.slice(0,7);
const parseMoney = s => Number(String(s||'').replace(/[^\d]/g,''))||0;
const parseDec = s => { const n=parseFloat(String(s||'').replace(/\s/g,'').replace(',','.')); return isFinite(n)?n:0; };
const clone = o => JSON.parse(JSON.stringify(o));
const addMonths = (ym, k) => { let [y,m]=ym.split('-').map(Number); m+=k; while(m>12){m-=12;y++;} while(m<1){m+=12;y--;} return `${y}-${pad(m)}`; };
const monthLabel = ym => { const [y,m]=ym.split('-').map(Number); return `${MESES[m-1]} ${y}`; };
const dayLabel = iso => { const d=new Date(iso+'T12:00:00'); return d.toLocaleDateString('es-CO',{weekday:'long',day:'numeric',month:'long'}); };
const shortDate = iso => { if(!iso) return '—'; const [y,m,d]=iso.split('-').map(Number); return `${d} ${MES3[m-1]}`; };
const daysUntil = iso => { const a=new Date(todayISO()+'T12:00:00'), b=new Date(iso+'T12:00:00'); return Math.round((b-a)/864e5); };
const addFreq = (iso, f) => { const d=new Date(iso+'T12:00:00'); if(f==='semanal') d.setDate(d.getDate()+7); else if(f==='trimestral') d.setMonth(d.getMonth()+3); else if(f==='anual') d.setFullYear(d.getFullYear()+1); else d.setMonth(d.getMonth()+1); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const FREQ = {semanal:'Semanal',mensual:'Mensual',trimestral:'Trimestral',anual:'Anual'};
const mensualDe = s => { const v=s.monto||0; return s.frecuencia==='anual'?v/12:s.frecuencia==='trimestral'?v/3:s.frecuencia==='semanal'?v*52/12:v; };
const USO = {alto:'Lo uso mucho',medio:'A veces',bajo:'Casi nunca'};
const ESTADO = {activa:'Activa',evaluar:'Evaluar',cancelar:'Cancelar',cancelada:'Cancelada'};
const METODOS = ['Débito','Tarjeta de crédito','Transferencia / Nequi','Efectivo'];

// ---------- Estado ----------
function defaultConfig(){
  const g = (id,nombre,color)=>({id,nombre,tipo:'gasto',color,presupuesto:0});
  const i = (id,nombre,color)=>({id,nombre,tipo:'ingreso',color,presupuesto:0});
  return { v:1, ajustes:{},
    categorias:[
      i('hon','Honorarios',PALETTE[1]), i('sal','Salario',PALETTE[5]), i('ven','Ventas',PALETTE[11]), i('oin','Otros ingresos',PALETTE[9]),
      g('viv','Vivienda y servicios',PALETTE[0]), g('mer','Mercado',PALETTE[1]), g('tra','Transporte',PALETTE[3]),
      g('ss','Seguridad social',PALETTE[5]), g('sal2','Salud',PALETTE[2]), g('res','Restaurantes y domicilios',PALETTE[10]),
      g('sus','Suscripciones',PALETTE[4]), g('deu','Pago de deudas',PALETTE[8]), g('ocio','Ocio y salidas',PALETTE[6]),
      g('edu','Educación',PALETTE[7]), g('hog','Hogar',PALETTE[11]), g('rop','Ropa y cuidado personal',PALETTE[9]), g('otr','Otros gastos',PALETTE[9])
    ], deudas:[], suscripciones:[] };
}
let S = { config: defaultConfig(), meses: {} };
let demo = false, loaded = false;
let cur = monthOf(todayISO());
let tab = 'resumen';
let filtro = {q:'', tipo:'', cat:''};

const cats = tipo => S.config.categorias.filter(c=>!tipo||c.tipo===tipo);
const catById = id => S.config.categorias.find(c=>c.id===id) || {id, nombre:'Sin categoría', color:'#8792A0', tipo:'gasto'};
const mkey = ym => 'm-'+ym;
const items = ym => (S.meses[mkey(ym)]?.items)||[];
function totals(ym){
  let ing=0, ret=0, gas=0; const porCat={};
  for(const it of items(ym)){
    if(it.tipo==='ingreso'){ ing+=it.monto; ret+=(it.retencion||0); }
    else { gas+=it.monto; porCat[it.categoria]=(porCat[it.categoria]||0)+it.monto; }
  }
  return {ing, ret, neto:ing-ret, gas, bal:ing-ret-gas, porCat};
}

// ---------- Datos de ejemplo (solo si no hay nada guardado) ----------
function buildDemo(){
  const cfg = defaultConfig();
  const B = {viv:1600000, mer:900000, tra:350000, ss:780000, res:300000, sus:150000, deu:850000, ocio:250000, hog:150000, rop:150000};

// ---------- Persistencia ----------
let col = null, mode = 'loading';
const dirty = {}, inFlight = {}, chains = {};
let flushTimer = null, lastErr = '';
const remoteIds = new Set();
const LS_KEY = 'mis-cuentas-v1';

function setStatus(txt, err){ const el=document.getElementById('status'); el.textContent=txt; el.classList.toggle('err',!!err); }
function refreshStatus(){
  if(lastErr) return setStatus(lastErr,true);
  if(mode==='local') return setStatus(demo?'Datos de ejemplo':'Guardado en este dispositivo');
  if(demo) return setStatus('Datos de ejemplo (sin guardar)');
  const pending = Object.keys(dirty).length;
  setStatus(pending ? 'Guardando…' : 'Todo guardado ✓');
}
function docBody(id){
  if(id==='config') return S.config;
  const m = S.meses[id]; return (m && m.items && m.items.length) ? m : null;
}
function save(...ids){
  if(demo){ demo=false; ids = ['config', ...Object.keys(S.meses)]; }
  ids.forEach(id=>{ dirty[id]=(dirty[id]||0)+1; });
  refreshStatus();
  clearTimeout(flushTimer); flushTimer=setTimeout(flush,350);
}
function flush(){
  if(mode==='local'){ try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){} Object.keys(dirty).forEach(k=>delete dirty[k]); refreshStatus(); return; }
  if(!col) return;
  for(const id of Object.keys(dirty)){
    const ver = dirty[id];
    if(inFlight[id]===ver) continue;
    inFlight[id]=ver;
    const body = docBody(id); const snap = body ? clone(body) : null;
    const run = (retry) => (snap ? col.doc(id).set(snap) : col.doc(id).delete()).catch(e=>{
      if(e && e.code==='unavailable' && !retry) return new Promise(r=>setTimeout(r,600+Math.random()*900)).then(()=>run(true));
      throw e;
    });
    chains[id] = (chains[id]||Promise.resolve()).then(()=>run(false)).then(()=>{
      if(snap) remoteIds.add(id); else remoteIds.delete(id);
      if(dirty[id]===ver) delete dirty[id];
      lastErr=''; refreshStatus();
    }).catch(e=>{
      const c = e && e.code;
      lastErr = c==='quota_exceeded' ? 'Almacenamiento lleno: borra meses antiguos' : c==='invalid_argument' ? 'No tienes permiso para guardar aquí' : 'No se pudo guardar; reintentando…';
      inFlight[id]=undefined; refreshStatus();
      if(c!=='quota_exceeded' && c!=='invalid_argument'){ clearTimeout(flushTimer); flushTimer=setTimeout(flush,4000); }
    });
  }
}
function normalizeConfig(c){
  const d = defaultConfig();
  return { v:1, ajustes:{...d.ajustes, ...(c.ajustes||{})}, categorias: Array.isArray(c.categorias)&&c.categorias.length?c.categorias:d.categorias,
    deudas: Array.isArray(c.deudas)?c.deudas:[], suscripciones: Array.isArray(c.suscripciones)?c.suscripciones:[] };
}
function applyRemote(docs, fromCache){
  const ids = Object.keys(docs);
  if(!ids.length){
    if(fromCache) return;
    if(!loaded){ loaded=true; enterDemo(); }
    return;
  }
  loaded = true;
  const before = demo ? '' : JSON.stringify(S);
  if(demo){ demo=false; S={config:defaultConfig(),meses:{}}; }
  remoteIds.clear(); ids.forEach(i=>remoteIds.add(i));
  for(const id of ids){
    if(dirty[id]) continue;
    const data = clone(docs[id]);
    if(id==='config') S.config = normalizeConfig(data);
    else if(id.startsWith('m-')) S.meses[id] = {items: Array.isArray(data.items)?data.items:[]};
  }
  for(const id of Object.keys(S.meses)) if(!docs[id] && !dirty[id]) delete S.meses[id];
  if(JSON.stringify(S)!==before) render();
}
function enterDemo(){ demo=true; S=buildDemo(); render(); refreshStatus(); }

async function initStore(){
  let db=null, user=null, id=null;
  try{ [db,user] = await Promise.all([window.claude?.use?.('db'), window.claude?.use?.('user')]); }catch(e){}
  try{ id = user ? await user.id() : null; }catch(e){}
  if(db && id){
    mode='db'; col = db.collection('data/users/'+id);
    const t = setTimeout(()=>{ if(!loaded){ setStatus('No se pudo conectar todavía; reintentando…',true); } }, 10000);
    col.onSnapshot(snap=>{
      if(!snap.metadata.fromCache){ clearTimeout(t); }
      const docs={}; snap.docs.forEach(d=>{ if(d.exists) docs[d.id]=d.data(); });
      applyRemote(docs, snap.metadata.fromCache);
      refreshStatus();
    }, err=>{
      clearTimeout(t);
      lastErr='Se perdió la conexión con el almacenamiento. Recarga la página.';
      if(!loaded){ loaded=true; enterDemo(); }
      refreshStatus();
    });
  } else {
    mode='local';
    try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){}
    let raw=null; try{ raw=localStorage.getItem(LS_KEY); }catch(e){}
    if(raw){ try{ const o=JSON.parse(raw); S={config:normalizeConfig(o.config||{}), meses:o.meses||{}}; loaded=true; render(); }catch(e){ enterDemo(); } }
    else { loaded=true; enterDemo(); }
    refreshStatus();
  }
}

      <div class="amt">${fmt(r.v)}${r.p?`<small>de ${fmt(r.p)}</small>`:''}</div></div>`;}).join('')}</div>` : `<div class="empty">Aún no hay gastos este mes.</div>`;

function chart6(){
  const ms = []; for(let k=-5;k<=0;k++) ms.push(addMonths(cur,k));
  const data = ms.map(m=>{ const t=totals(m); return {m, i:t.neto, g:t.gas}; });
  const mx = Math.max(1,...data.map(d=>Math.max(d.i,d.g)));
  const step = niceStep(mx/4), top = step*Math.ceil(mx/step);
  const W=560,H=210,L=52,B=26,T=10, cw=(W-L-8)/6, bw=Math.min(22,cw/3);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Ingresos y gastos de los últimos seis meses">`;
  for(let v=0; v<=top+1; v+=step){ const y=H-B-(v/top)*(H-B-T); s+=`<line x1="${L}" x2="${W-4}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${L-6}" y="${y+4}" text-anchor="end" font-size="11" fill="var(--muted)">${fmtShort(v)}</text>`; }
  data.forEach((d,j)=>{ const cx=L+cw*j+cw/2; const hi=(d.i/top)*(H-B-T), hg=(d.g/top)*(H-B-T); const isCur=d.m===cur;
    s+=`<rect x="${cx-bw-2}" y="${H-B-hi}" width="${bw}" height="${hi}" rx="3" fill="var(--pos)" opacity="${isCur?1:.55}"><title>Ingresos ${monthLabel(d.m)}: ${fmt(d.i)}</title></rect>`;
    s+=`<rect x="${cx+2}" y="${H-B-hg}" width="${bw}" height="${hg}" rx="3" fill="var(--neg)" opacity="${isCur?1:.55}"><title>Gastos ${monthLabel(d.m)}: ${fmt(d.g)}</title></rect>`;
    s+=`<text x="${cx}" y="${H-8}" text-anchor="middle" font-size="12" fill="${isCur?'var(--ink)':'var(--muted)'}" font-weight="${isCur?700:500}">${MES3[Number(d.m.slice(5))-1]}</text>`; });
  s += `</svg><div class="legend"><span><i class="dot" style="background:var(--pos)"></i>Ingresos netos</span><span><i class="dot" style="background:var(--neg)"></i>Gastos</span></div>`;
  return s;
}
function niceStep(x){ const p=Math.pow(10,Math.floor(Math.log10(x||1))); const n=x/p; return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p; }

function subAlerts(){
  const out=[]; const t=todayISO();
  const when = d => d<0?`hace ${-d} día${d===-1?'':'s'}`:d===0?'hoy':d===1?'mañana':`en ${d} días`;

    const cands=[s.proximoCobro,s.cancelarAntes].filter(Boolean).sort();
    const lim=cands[0]||null, d=lim!==null?daysUntil(lim):null;
    const limTxt = lim ? `${lim===s.cancelarAntes&&s.cancelarAntes!==s.proximoCobro?'la fecha límite':'el próximo cobro'} (${shortDate(lim)}, ${when(d)})` : '';
    const cobrada = items(monthOf(t)).some(i=>i.subId===s.id && s.marcadaEl && i.fecha>=s.marcadaEl);
    if(s.estado==='cancelar'){

}

function deudaCalc(d){
  const r = Math.pow(1+(d.tasa||0)/100,1/12)-1;
  const S0=d.saldo||0, C=d.cuota||0;
  if(S0<=0) return {r, n:0, int:0, ok:true};
  if(C<=0) return {r, n:null, ok:false, msg:'Define una cuota'};
  if(r===0){ const n=Math.ceil(S0/C); return {r,n,int:0,ok:true}; }
  if(C<=S0*r) return {r, n:null, ok:false, msg:'La cuota no alcanza a cubrir los intereses'};
  const n = Math.ceil(-Math.log(1-r*S0/C)/Math.log(1+r));
  return {r, n, int: Math.max(0, n*C - S0), ok:true};
}

const norm = s => String(s||'').normalize('NFC').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');

const NUMW = {cero:0,un:1,uno:1,una:1,dos:2,tres:3,cuatro:4,cinco:5,seis:6,siete:7,ocho:8,nueve:9,diez:10,once:11,doce:12,trece:13,catorce:14,quince:15,dieciseis:16,diecisiete:17,dieciocho:18,diecinueve:19,veinte:20,veintiun:21,veintiuno:21,veintidos:22,veintitres:23,veinticuatro:24,veinticinco:25,veintiseis:26,veintisiete:27,veintiocho:28,veintinueve:29,treinta:30,cuarenta:40,cincuenta:50,sesenta:60,setenta:70,ochenta:80,noventa:90,cien:100,ciento:100,doscientos:200,doscientas:200,trescientos:300,trescientas:300,cuatrocientos:400,cuatrocientas:400,quinientos:500,quinientas:500,seiscientos:600,seiscientas:600,setecientos:700,setecientas:700,ochocientos:800,ochocientas:800,novecientos:900,novecientas:900};
const MULT_MIL = /^(mil|luca|lucas|k|barras?)$/, MULT_MM = /^(millon|millones|palo|palos|melon|melones)$/;
function numTok(t){
  t = t.replace(/^\$/,'');
  if(/^\d{1,3}([.,]\d{3})+([.,]\d{2})?$/.test(t)){ const p=t.split(/[.,]/); if(p.length>2 && p[p.length-1].length===2) p.pop(); return Number(p.join('')); }
  if(/^\d+[.,]\d{1,2}$/.test(t)) return Number(t.replace(',','.'));
  if(/^\d+$/.test(t)) return Number(t);
  return null;
}
// Encuentra todas las cantidades habladas o escritas en un texto normalizado. Devuelve [{v,start,end}]
function findAmounts(n){
  const toks=[]; const re=/\$?\s?\d[\d.,]*|[a-z]+/g; let m;
  while((m=re.exec(n))) toks.push({t:m[0].replace(/\s/g,''), s:m.index, e:m.index+m[0].length});
  const out=[]; let i=0;
  while(i<toks.length){
    const isStart = x => numTok(x)!==null || NUMW[x]!==undefined || MULT_MM.test(x) && false;
    if(!isStart(toks[i].t)){ i++; continue; }
    let total=0, curr=0, last=1, j=i, used=false, s=toks[i].s, e=toks[i].e;
    while(j<toks.length){
      const x=toks[j].t, v=numTok(x);
      if(v!==null){ if(used && curr && !(curr%1000===0) && v<1000 && curr<1000) break; curr+=v; used=true; }
      else if(NUMW[x]!==undefined){ curr+=NUMW[x]; used=true; }
      else if(MULT_MIL.test(x) && used){ curr=(curr||1)*1000; last=1000; }
      else if(MULT_MM.test(x) && used){ total+=(curr||1)*1e6; curr=0; last=1e6; }
      else if(x==='de' && j+1<toks.length && MULT_MM.test(toks[j-1]?.t||'') && /^(pesos?)$/.test(toks[j+1].t)){ }
      else if(x==='y' && j+1<toks.length && (NUMW[toks[j+1].t]!==undefined || toks[j+1].t==='medio')){ }
      else if(x==='medio' && used){ curr+=last/2; }
      else if(/^pesos?$/.test(x) && used){ e=toks[j].e; j++; break; }
      else break;
      e=toks[j].e; j++;
    }
    const v=Math.round(total+curr);
    if(used && v>0) out.push({v,start:s,end:e});
    i=Math.max(j,i+1);
  }
  return out;
}
const MESN = {enero:1,febrero:2,marzo:3,abril:4,mayo:5,junio:6,julio:7,agosto:8,septiembre:9,setiembre:9,octubre:10,noviembre:11,diciembre:12};

function findDate(n){

  [/\b(con|en|por|pague con|pagado con)?\s*(la )?tarjeta( de credito)?\b|\bcredito\b(?! de libre)/, 'Tarjeta de crédito'],
  [/\b(con|en|por)?\s*(la )?(tarjeta )?debito\b/, 'Débito'],
  [/\b(en|con)?\s*efectivo\b|\bcash\b/, 'Efectivo'],

function guessCat(n, tipo){
  const list = cats(tipo);
  for(const c of list){ const cn=norm(c.nombre); if(cn.length>=4 && new RegExp('\\b'+cn.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b').test(n)) return c.id; }
  let best=null, bestLen=0;
  for(const [id,words] of Object.entries(KW)){
    if(!list.find(c=>c.id===id)) continue;
    for(const w of words){ if(w.length>bestLen && new RegExp('\\b'+w+'\\b').test(n)){ best=id; bestLen=w.length; } }
  }
  if(best) return best;
  const fb = list.find(c=>/^(otr|oin)$/.test(c.id)) || list[list.length-1];
  return fb ? fb.id : '';
}
// Interpreta una frase como "gasté 85 mil en mercado con tarjeta ayer"
function parseFrase(text){

  if(ING_RE.test(n) && !(GAS_RE.test(n) && !/\bme pagaron\b/.test(n))) r.tipo='ingreso';
  if(/\b(ingreso|entrada)\b/.test(n)) r.tipo='ingreso';
  if(/\b(gasto|egreso)\b/.test(n)) r.tipo='gasto';
  const d = findDate(n); if(d){ r.fecha=d.f; cut.push([d.s,d.e]); }
  let amts = findAmounts(n).filter(a=>!(d && a.start>=d.s && a.end<=d.e));
  const rm = /\b(retencion|retuvieron|me retuvieron|descontaron)\b/.exec(n);
  if(rm){ const after = amts.filter(a=>a.start>rm.index); if(after.length){ r.retencion=after[0].v; cut.push([rm.index, after[0].end]); amts=amts.filter(a=>a!==after[0]); } }
  if(amts.length){ const a = amts.reduce((x,y)=>y.v>x.v?y:x); r.monto=a.v; cut.push([a.start,a.end]); }
  for(const [re,met] of MET_RES){ const mm=re.exec(n); if(mm){ r.metodo=met; cut.push([mm.index, mm.index+mm[0].length]); break; } }
  r.categoria = guessCat(n, r.tipo);
  // descripción: lo que queda sin verbos ni conectores
  let chars = orig.split('');
  cut.forEach(([s,e])=>{ for(let k=s;k<e&&k<chars.length;k++) chars[k]=' '; });
  let desc = chars.join('');
  desc = desc.replace(/(?<!\p{L})(hoy|ayer|tanque[eé]|almorc[eé]|gast[eé]|pagu[eé]|compr[eé]|me cobraron|me pagaron|me consignaron|me transfirieron|me depositaron|recib[ií]|cobr[eé]|vend[ií]|sali[oó]|registra(r)?|anota(r)?|agrega(r)?|un|una|el|la|los|las|de|del|en|con|por|para|y|pesos?|gasto|ingreso|egreso|unos|unas|como|aproximadamente)(?!\p{L})/giu,' ').replace(/[,.;:$]/g,' ').replace(/\s+/g,' ').trim();
  if(desc.length>60) desc = desc.slice(0,60).trim();
  r.descripcion = desc ? desc.charAt(0).toUpperCase()+desc.slice(1) : (catById(r.categoria).nombre||'');
  return r;
}

function parseFactura(text){
  const lines = String(text||'').split(/\n+/).map(l=>l.trim()).filter(Boolean);
  const money = s => { const out=[]; const re=/\$?\s?(\d{1,3}(?:[.,\s]\d{3})+(?:[.,]\d{2})?|\d{4,9}(?:[.,]\d{2})?)/g; let m; while((m=re.exec(s))){ let t=m[1].replace(/\s/g,'.'); const v=numTok(t); if(v!==null && v>=100 && v<1e9) out.push(Math.round(v)); } return out; };
  let total=0;
  const prio = [/total\s*a\s*pagar|valor\s*a\s*pagar|neto\s*a\s*pagar|total\s*factura|valor\s*total|total\s*venta|gran\s*total/i, /(^|[^a-z])total([^a-z]|$)/i];
  for(const re of prio){
    for(let i=0;i<lines.length && !total;i++){
      const l=lines[i]; if(!re.test(l) || /sub\s*-?\s*total|total\s*(iva|impuesto|items?|articulos|unidades|descuento)|base/i.test(l)) continue;
      let v = money(l); if(!v.length && lines[i+1]) v = money(lines[i+1]);
      if(v.length) total = Math.max(...v);
    }
    if(total) break;
  }
  if(!total){ const all = lines.flatMap(money); if(all.length) total=Math.max(...all); }
  let fecha='';
  const T=todayISO();
  for(const l of lines){
    let m = /(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/.exec(l);
    if(m){ fecha=`${m[1]}-${pad(+m[2])}-${pad(+m[3])}`; break; }
    m = /(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})/.exec(l);
    if(m){ let y=+m[3]; if(y<100) y+=2000; let d=+m[1], mo=+m[2]; if(mo>12 && d<=12){ const x=d; d=mo; mo=x; } if(mo>=1&&mo<=12&&d>=1&&d<=31){ fecha=`${y}-${pad(mo)}-${pad(d)}`; break; } }
    m = /(\d{1,2})\s*(?:de\s*)?(ene|feb|mar|abr|may|jun|jul|ago|sep|set|oct|nov|dic)[a-z]*\.?\s*(?:de\s*)?(\d{4})/i.exec(norm(l));
    if(m){ const mi=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'].indexOf(m[2].toLowerCase().replace('set','sep'))+1; fecha=`${m[3]}-${pad(mi)}-${pad(+m[1])}`; break; }
  }
  if(!fecha || fecha>T || fecha<addDays(T,-400)) fecha=T;
  const skip=/nit|factura|fact\.|regimen|resolucion|dian|tel|direcci|cra|calle|carrera|cll|kr\b|no\.|fecha|hora|caja|cajero|cliente|c\.c|www|@|iva/i;
  let comercio = lines.slice(0,8).find(l=>/[A-Za-zÁÉÍÓÚÑáéíóúñ]{3,}/.test(l) && !skip.test(l) && l.replace(/[^A-Za-zÁÉÍÓÚÑáéíóúñ]/g,'').length>=3) || '';
  comercio = comercio.replace(/[^\wÁÉÍÓÚÑáéíóúñ&.\- ]/g,'').replace(/\s+/g,' ').trim().slice(0,50);
  if(comercio===comercio.toUpperCase()) comercio = comercio.toLowerCase().replace(/(^|\s)\S/g,c=>c.toUpperCase());
  const nAll = norm(text);
  let metodo='';
  if(/efectivo|cambio/.test(nAll)) metodo='Efectivo';
  if(/debito|tarj.*deb/.test(nAll)) metodo='Débito';
  if(/credito|visa|mastercard|master card|amex|diners/.test(nAll) && !/nota credito/.test(nAll)) metodo = metodo==='Débito'?'Débito':'Tarjeta de crédito';
  if(/nequi|daviplata|transferencia|qr/.test(nAll)) metodo='Transferencia / Nequi';
  return {tipo:'gasto', monto:total, categoria:guessCat(nAll,'gasto'), descripcion:comercio, fecha, metodo};
}

    if(!SpeechRec){ txt.value=''; txt.focus(); status('Este navegador no permite dictado directo. Toca el micrófono de tu teclado, dicta y luego toca “Interpretar texto”.'); return; }
    try{
      rec=new SpeechRec(); rec.lang='es-CO'; rec.interimResults=true; rec.continuous=false; rec.maxAlternatives=1;
      let finalTxt='';
      rec.onresult=e=>{ let interim=''; for(let i=e.resultIndex;i<e.results.length;i++){ const r=e.results[i]; if(r.isFinal) finalTxt+=r[0].transcript+' '; else interim+=r[0].transcript; } txt.value=(finalTxt+interim).trim(); };
      rec.onerror=e=>{ status(e.error==='not-allowed'||e.error==='service-not-allowed'?'No hay permiso para el micrófono. Actívalo en el navegador, o dicta con el micrófono del teclado.':e.error==='no-speech'?'No escuché nada. Intenta de nuevo.':'No se pudo dictar ('+e.error+'). Puedes escribirlo.','err'); };
      rec.onend=()=>{ rec=null; bVoz.classList.remove('rec'); bVoz.querySelector('span').textContent='Dictar'; if(txt.value.trim()) interpretar(); };
      rec.start(); bVoz.classList.add('rec'); bVoz.querySelector('span').textContent='Detener'; txt.value='';
      status('Escuchando… di algo como “gasté 85 mil en mercado con tarjeta”.');
    }catch(e){ rec=null; status('No se pudo iniciar el dictado. Usa el micrófono del teclado.','err'); txt.focus(); }
  };
  m.querySelector('#fFoto').addEventListener('change', async e=>{
    const f=e.target.files&&e.target.files[0]; if(!f) return;
    box.style.display=''; img.src=URL.createObjectURL(f); img.style.display=''; txt.value='';
    bar.style.display=''; const bi=bar.querySelector('i'); bi.style.width='4%';
    status(iaCfg().key?'Leyendo la factura con IA…':'Leyendo la factura… (la primera vez tarda un poco más)');
    try{
      const r = await interpretarFoto(f, p=>{ bi.style.width = p<0 ? '60%' : Math.max(4,Math.round(p*100))+'%'; });
      bi.style.width='100%'; setTimeout(()=>bar.style.display='none',400);
      if(r.texto) txt.value=r.texto.split('\n').filter(l=>l.trim()).slice(0,40).join('\n');
      fill(r.data, r.via, r.err?`(La IA falló: ${r.err}; se usó la lectura del teléfono.)`:'');
    }catch(err){ bar.style.display='none'; status('No pude leer la factura: '+err.message+'. Ingresa los datos a mano.','err'); }
    e.target.value='';
  });
}

      });
  });
}

    const fecha = s.proximoCobro && s.proximoCobro<=todayISO() ? s.proximoCobro : todayISO();
    const catSus = S.config.categorias.find(c=>c.id==='sus')?.id || cats('gasto')[0].id;
    const k = putMov({id:uid(),tipo:'gasto',categoria:catSus,monto:s.monto,fecha,descripcion:s.nombre,metodo:s.metodo||'Tarjeta de crédito',subId:s.id});
    let nx = s.proximoCobro || fecha; do { nx = addFreq(nx, s.frecuencia); } while(nx<=todayISO());
    s.proximoCobro = nx; save('config',k); render(); toast(`Cobro de ${s.nombre} registrado. Próximo: ${shortDate(nx)}`);
  }
  else if(act==='subState'){ const s=S.config.suscripciones.find(x=>x.id===id); if(!s) return; setSubEstado(s,b.dataset.v); save('config'); render();
    if(b.dataset.v==='cancelada') toast(`Listo: ${s.nombre} cancelada. Ahorras ${fmt(mensualDe(s)*12)} al año.`); }
  else if(act==='newDebt') debtModal(null);
  else if(act==='editDebt') debtModal(S.config.deudas.find(d=>d.id===id));
  else if(act==='payDebt') payModal(S.config.deudas.find(d=>d.id===id));
  else if(act==='newCat') catModal(b.dataset.tipo);
  else if(act==='colorCat') colorModal(S.config.categorias.find(c=>c.id===id));
  else if(act==='delCat'){
    const c=S.config.categorias.find(x=>x.id===id); if(!c) return;
    const used = Object.values(S.meses).reduce((a,m)=>a+m.items.filter(i=>i.categoria===id).length,0);
    const same = cats(c.tipo).filter(x=>x.id!==id);
    if(!same.length){ toast('Debe quedar al menos una categoría de este tipo'); return; }
    const dest = same.find(x=>/otr|oin/.test(x.id)) || same[same.length-1];
    if(!await confirmDlg(`Se eliminará “${esc(c.nombre)}”.${used?` Sus ${used} movimientos pasarán a “${esc(dest.nombre)}”.`:''}`,'Eliminar')) return;
    const touched=['config'];
    for(const [k,m] of Object.entries(S.meses)){ let ch=false; m.items.forEach(i=>{ if(i.categoria===id){ i.categoria=dest.id; ch=true; } }); if(ch) touched.push(k); }
    S.config.categorias=S.config.categorias.filter(x=>x.id!==id); save(...touched); render();
  }
  else if(act==='startBlank'){ demo=false; S={config:defaultConfig(),meses:{}}; save('config'); render(); }
  else if(act==='keepDemo'){ save('config'); render(); }
  else if(act==='copyCsv'){
    const rows=[['Fecha','Tipo','Categoría','Descripción','Valor','Retención','Medio de pago']].concat(items(cur).slice().sort((a,b)=>a.fecha.localeCompare(b.fecha)).map(i=>[i.fecha,i.tipo,catById(i.categoria).nombre,i.descripcion||'',i.monto,i.retencion||0,i.metodo||'']));
    copyText(rows.map(r=>r.map(v=>String(v).replace(/\t/g,' ')).join('\t')).join('\n'),'Movimientos para Excel');
  }
  else if(act==='copyBackup'){ copyText(JSON.stringify({app:'mis-cuentas',v:1,fecha:todayISO(),...S}),'Respaldo'); }
  else if(act==='restore'){
    textModal('Restaurar respaldo','Pega aquí el texto de un respaldo copiado antes. Reemplazará todos tus datos actuales.','',(txt)=>{
      let o; try{ o=JSON.parse(txt); }catch(_){ return 'El texto no es un respaldo válido.'; }
      if(!o||!o.config||!o.meses) return 'El texto no es un respaldo de Mi Bolsillo.';
      restaurarDe(o); closeModal(); render(); toast('Respaldo restaurado'); return null;
    },'Restaurar');
  }
  else if(act==='dlBackup'){ downloadFile(`mi-bolsillo-respaldo-${todayISO()}.json`, JSON.stringify({app:'mis-cuentas',v:1,fecha:todayISO(),...S}), 'application/json') ? toast('Respaldo descargado') : copyText(JSON.stringify({app:'mis-cuentas',v:1,fecha:todayISO(),...S}),'Respaldo'); }
  else if(act==='dlCsv'){
    const all = Object.values(S.meses).flatMap(m=>m.items).sort((a,b)=>a.fecha.localeCompare(b.fecha));
    const q = v => { const t=String(v??''); return /[;"\n]/.test(t)?'"'+t.replace(/"/g,'""')+'"':t; };
    const rows=[['Fecha','Tipo','Categoría','Descripción','Valor','Retención','Medio de pago']].concat(all.map(i=>[i.fecha,i.tipo,catById(i.categoria).nombre,i.descripcion||'',i.monto,i.retencion||0,i.metodo||'']));
    downloadFile(`mi-bolsillo-movimientos-${todayISO()}.csv`, '\ufeff'+rows.map(r=>r.map(q).join(';')).join('\n'), 'text/csv;charset=utf-8');
  }
  else if(act==='iaSave'||act==='iaTest'){
    const key=document.getElementById('iaKey').value.trim(), model=document.getElementById('iaModel').value.trim()||'claude-haiku-5-5';
    iaSave(key?{key,model}:{}); const msg=document.getElementById('iaMsg');
    if(act==='iaSave'){ toast(key?'Clave guardada':'IA desactivada'); render(); return; }
    if(!key){ msg.textContent='Escribe una clave para probar.'; return; }
    msg.textContent='Probando…';
    try{ const r=await iaPedir([{type:'text',text:iaPrompt('Convierte esta frase en un movimiento: "gasté 20 mil en un almuerzo"')}]); msg.textContent=`Funciona ✓ (entendió ${fmt(r.monto)}).`; msg.style.color='var(--pos)'; }
    catch(e){ msg.textContent='No funcionó: '+e.message; msg.style.color='var(--neg)'; }
  }
  else if(act==='iaDel'){ iaSave({}); render(); toast('Clave eliminada'); }
  else if(act==='wipe'){
    if(!await confirmDlg('Se borrarán todos tus movimientos, suscripciones, deudas y categorías. Copia un respaldo antes si lo necesitas.','Borrar todo')) return;
    const old=[...new Set([...Object.keys(S.meses), ...remoteIds])].filter(k=>k.startsWith('m-'));
    demo=false; S={config:defaultConfig(),meses:{}}; save('config',...old); render();
  }
});
function restaurarDe(o){
  const old = Object.keys(S.meses);
  demo=false; S={config:normalizeConfig(o.config), meses:{}};
  for(const [k,m] of Object.entries(o.meses)) if(/^m-\d{4}-\d{2}$/.test(k)&&Array.isArray(m.items)) S.meses[k]={items:m.items};
  save('config', ...new Set([...old, ...remoteIds, ...Object.keys(S.meses)].filter(k=>k.startsWith('m-'))));
}
document.addEventListener('change', async e=>{
  if(e.target.id!=='fBackup') return;
  const f=e.target.files&&e.target.files[0]; if(!f) return;
  let o; try{ o=JSON.parse(await f.text()); }catch(_){ toast('Ese archivo no es un respaldo válido'); return; }
  if(!o||!o.config||!o.meses){ toast('Ese archivo no es un respaldo de Mi Bolsillo'); return; }
  if(!await confirmDlg('Se reemplazarán todos tus datos actuales por los del respaldo.','Restaurar',false)) return;
  restaurarDe(o); render(); toast('Respaldo restaurado');
});
// Edición en línea (selects de suscripciones, categorías, filtros, ajustes)
let inlineTimer=null;
document.addEventListener('change', e=>{
  const t=e.target;
  if(t.dataset.subfield){ const s=S.config.suscripciones.find(x=>x.id===t.dataset.id); if(s){ if(t.dataset.subfield==='estado') setSubEstado(s,t.value); else s[t.dataset.subfield]=t.value; save('config'); render(); } }
  else if(t.id==='ft'){ filtro.tipo=t.value; render(); }
  else if(t.id==='fc'){ filtro.cat=t.value; render(); }
});
document.addEventListener('input', e=>{
  const t=e.target;
  if(t.id==='fq'){ filtro.q=t.value; const pos=t.selectionStart; render(); const n=document.getElementById('fq'); if(n){ n.focus(); try{ n.setSelectionRange(pos,pos); }catch(_){} } }
  else if(t.dataset.catfield){ const c=S.config.categorias.find(x=>x.id===t.dataset.id); if(!c) return;
    if(t.dataset.catfield==='presupuesto'){ const n=parseMoney(t.value); t.value=n?NUM.format(n):''; c.presupuesto=n; } else c.nombre=t.value;
    clearTimeout(inlineTimer); inlineTimer=setTimeout(()=>save('config'),500); }
});

// Inicio
const h0 = (location.hash||'').slice(1); if(['resumen','movimientos','suscripciones','deudas','categorias','ajustes'].includes(h0)) tab=h0;
render();
initStore();
})();
</script>
